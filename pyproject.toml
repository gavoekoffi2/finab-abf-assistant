[project]
name = "finab-abf-flow"
version = "0.3.0"
description = "Finab ABF Flow backend"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.0",
  "pydantic>=2.7.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
